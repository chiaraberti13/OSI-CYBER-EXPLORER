name: OpenSSF Scorecard

# Trend indicator only: the score is published and archived, never a merge gate.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # JSON keeps every check, including inconclusive (-1) results that
          # SARIF omits. Never turn a score into a required threshold.
          results_file: scorecard.json
          results_format: json
          publish_results: true

      - name: Archive Scorecard results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-json-${{ github.run_id }}
          path: scorecard.json
          if-no-files-found: error
          retention-days: 90

  report:
    name: Scorecard trend report
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    # Publishing requires an action-only analysis job. Custom processing lives
    # here, without OIDC, write permissions, npm dependencies or score gates.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Download complete Scorecard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scorecard-json-${{ github.run_id }}
          path: scorecard-results

      - name: Compare checks with the versioned baseline
        run: |
          node scripts/scorecard-report.mjs \
            --input scorecard-results/scorecard.json \
            --baseline docs/scorecard/2026-10-05.json \
            --commit "$GITHUB_SHA" \
            --output scorecard-results/report.md
          cat scorecard-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive comparable trend report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: scorecard-results/
          if-no-files-found: error
          retention-days: 90
