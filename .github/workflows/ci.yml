name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported line (see package.json#engines) and the LTS pinned in .nvmrc.
        node-version: ['22.22.x', '24.x']
    name: build (Node ${{ matrix.node-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Audit policy: docs/DEPENDENCIES.md. Registry results do not depend on the
      # Node.js version, so the audit runs once, on the recommended LTS.
      - name: Audit runtime dependencies (blocking)
        if: matrix.node-version == '24.x'
        run: npm run audit:runtime

      - name: Audit full toolchain (report only, see ROADMAP SEC-06)
        if: matrix.node-version == '24.x'
        continue-on-error: true
        run: npm run audit:full
