name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported line (see package.json#engines) and the LTS pinned in .nvmrc.
        node-version: ['22.22.x', '24.x']
    name: build (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Audit policy: docs/DEPENDENCIES.md. Registry results do not depend on the
      # Node.js version, so the audit runs once, on the recommended LTS.
      - name: Audit runtime dependencies (blocking)
        if: matrix.node-version == '24.x'
        run: npm run audit:runtime

      - name: Audit full toolchain (report only, see ROADMAP SEC-01)
        if: matrix.node-version == '24.x'
        continue-on-error: true
        run: npm run audit:full
