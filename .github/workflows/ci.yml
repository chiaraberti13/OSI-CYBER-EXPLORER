name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported line (see package.json#engines) and the LTS pinned in .nvmrc.
        node-version: ['22.22.x', '24.x']
    name: build (Node ${{ matrix.node-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Bootstrap lockfile policy
        run: node --test scripts/verify-lockfile.test.mjs && node scripts/verify-lockfile.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate lockfile with lockfile-lint
        run: npm run lint:lockfile

      - name: Validate repository posture reporting and HSTS scope
        run: npm run verify:repository-posture && npm run verify:deployment-security

      - name: Validate offensive educational content
        run: npm run verify:offensive-content

      - name: Validate technical-content review ledger
        run: npm run verify:technical-content

      - name: Validate documentation-only targets
        run: npm run verify:documentation-targets

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with blocking logic coverage
        run: npm run test:coverage

      - name: Summarize logic coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const rows = ['lines', 'statements', 'branches', 'functions'].map((metric) => {
            const { covered, total, pct } = report.total[metric];
            return `| ${metric} | ${covered}/${total} | ${pct}% |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Coverage — src/lib',
            '',
            `${Object.keys(report).length - 1} logic modules; datasets and UI excluded.`,
            '',
            '| Metric | Covered/total | Coverage |',
            '|---|---:|---:|',
            ...rows,
            '',
            'See the coverage artifact for HTML, LCOV and JSON reports, including uncovered lines.',
            ''
          ].join('\n'));
          NODE

      - name: Upload logic coverage reports
        # Preserve diagnostics when tests or thresholds fail, without making the
        # coverage command non-blocking. Fresh runners cannot upload stale reports.
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: npm run build

      # Audit policy: docs/DEPENDENCIES.md. Registry results do not depend on the
      # Node.js version, so the audit runs once, on the recommended LTS.
      - name: Audit runtime dependencies (blocking)
        if: matrix.node-version == '24.x'
        run: npm run audit:runtime

      - name: 'Audit full toolchain (blocking: high/critical)'
        if: matrix.node-version == '24.x'
        run: npm run audit:full
