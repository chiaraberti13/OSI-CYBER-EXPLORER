name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.x', '24.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Bootstrap lockfile policy
        run: node --test scripts/verify-lockfile.test.mjs && node scripts/verify-lockfile.mjs
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate lockfile
        run: npm run lint:lockfile
      - name: Validate repository and deployment posture
        run: npm run verify:repository-posture && npm run verify:deployment-security
      - name: Validate educational and technical content
        run: npm run verify:offensive-content && npm run verify:technical-content && npm run verify:documentation-targets
      - name: Verify design-token contrast
        run: npm run verify:design-system
      - name: Verify accessibility release policy
        run: npm run verify:accessibility-release
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audit runtime dependencies
        if: matrix.node-version == '24.x'
        run: npm run audit:runtime
      - name: Audit full toolchain
        if: matrix.node-version == '24.x'
        run: npm run audit:full

  test:
    name: test and coverage (Node 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Bootstrap lockfile policy
        run: node --test scripts/verify-lockfile.test.mjs && node scripts/verify-lockfile.mjs
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test with blocking logic coverage
        run: npm run test:coverage
      - name: Summarize logic coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          const rows = ['lines', 'statements', 'branches', 'functions'].map((metric) => {
            const { covered, total, pct } = report.total[metric];
            return `| ${metric} | ${covered}/${total} | ${pct}% |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Coverage — src/lib', '',
            `${Object.keys(report).length - 1} logic modules; datasets and UI excluded.`, '',
            '| Metric | Covered/total | Coverage |', '|---|---:|---:|', ...rows, '',
            'See the coverage artifact for HTML, LCOV and JSON reports.', ''
          ].join('\n'));
          NODE
      - name: Upload logic coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-24.x
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  build:
    name: build and bundle (Node 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Bootstrap lockfile policy
        run: node --test scripts/verify-lockfile.test.mjs && node scripts/verify-lockfile.mjs
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build production bundle
        run: npm run build
      - name: Enforce JavaScript performance budgets
        run: npm run verify:performance
      - name: Generate bundle treemap
        run: npm run analyze:bundle
      - name: Upload production bundle and treemap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-bundle-node-24.x
          path: dist/
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: build (Node ${{ matrix.node-version }})
    if: ${{ always() }}
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        node-version: ['22.22.x', '24.x']
    steps:
      - name: Preserve required-check compatibility
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
