name: Content correction
description: Report a technical error or a translation to correct.
body:
  - type: markdown
    attributes:
      value: Report for OSI-CYBER-EXPLORER. Do not include personal data or secrets. For vulnerabilities,
        follow https://github.com/chiaraberti13/OSI-CYBER-EXPLORER/security/policy.
  - type: textarea
    id: location
    attributes:
      label: Affected content
      description: Identify the lab, section and language.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Error and correction
      description: Quote the passage and explain the proposed correction.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Provide an authoritative technical source and the access date.
    validations:
      required: true
