  <rect x="8.5" y="14.45" width="15" height="3.1" rx="1.55" fill="#ffffff" />
  <rect x="8.5" y="19.5" width="15" height="3.1" rx="1.55" fill="#ffffff" opacity="0.7" />
</svg>
